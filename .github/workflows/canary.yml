name: canary

# ---------------------------------------------------------------------------
# Ask, on a schedule, whether the jolt versions this fleet cares about still
# build every project. Two of them:
#
#   pinned   what the projects actually pin today (vars.JOLT_PIN, default 0.8.1)
#   latest   jolt's newest published release
#
# Identical while the fleet is up to date, and the run collapses to one build
# when they are. They diverge the moment jolt ships a release nobody has adopted
# yet, which is precisely the window this is meant to cover.
#
# NIGHTLY IS AVAILABLE NOW, and this block used to say it was not. jolt-lang/jolt#824
# merged 2026-09-02 and jolt publishes a rolling `vnightly` prerelease from main,
# so `install --version nightly` resolves it and the whole "build it from source
# against Chez on two operating systems" plan this file used to describe is moot.
# The fleet has been run against it: fan-out 33691047983, all five green, every
# project's log showing `Successfully installed jolt vnightly`.
#
# It is in the matrix, BEHIND A FRESHNESS CHECK, and the check is the whole reason
# the row can be trusted. jolt's publish-nightly runs only after its `libraries`
# and `libraries-db` gates, and it publishes by staging a draft, DELETING the old
# release, then moving the tag. So a lagging downstream library withholds the NEW
# artifact while the PREVIOUS vnightly stays up and installs perfectly.
#
# That is not hypothetical. jolt's own first nightly run published nothing at all,
# because `library db`, `library db (postgres)` and `library transit-jolt` were
# failing on main with "No dependency provides Locale ... a library supplies one by
# declaring :jolt/provides (RFC 0014)", the same breaking change v0.8.1 announced.
#
# Without a check, a `nightly` row that goes green cannot distinguish "main is
# healthy" from "main broke four days ago and we keep testing Tuesday's binary",
# and a green row that cannot go red is worse than no row, because it reads as
# coverage. So: read the vnightly release's published_at, SKIP the row when the
# artifact is older than vars.NIGHTLY_MAX_AGE_HOURS (default 48), and stamp the
# age on every result either way. A skipped row says so; it never passes quietly.
#
# The published_at also goes into the cache key. Without that, the change gate
# would see the literal string "nightly", find it unchanged from yesterday, and
# suppress every future nightly run after the first green.
#
# The pinned and latest rows are RELEASES, which have none of this problem: a
# release is immutable once published, so its row means what it says.
#
# TWO GATES, so an hourly tick is cheap:
#
#   interval  vars.CANARY_INTERVAL_HOURS (default 1). The cron itself cannot be
#             a variable, GitHub requires a literal, so the schedule ticks
#             hourly and this decides whether a tick does anything.
#   change    a run is skipped when this exact version set has already been
#             tested green. Keyed in the Actions cache, so no extra permissions
#             and nothing to commit back to the repository.
#
# A manual dispatch ignores both gates. That is the point of a manual dispatch.
# ---------------------------------------------------------------------------

on:
  schedule:
    # Hourly, at 7 past. Not on the hour, where GitHub's scheduler is most
    # congested and most likely to delay or drop a run.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      jolt-version:
        description: "Test only this version (blank = the pinned + latest pair)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.decide.outputs.versions }}
      proceed: ${{ steps.final.outputs.proceed }}
      reason: ${{ steps.decide.outputs.reason }}
      key: ${{ steps.decide.outputs.key }}
      nightly: ${{ steps.decide.outputs.nightly }}
    steps:
      - name: Work out what to test, and whether to bother
        id: decide
        env:
          REQUESTED: ${{ inputs.jolt-version }}
          PIN: ${{ vars.JOLT_PIN }}
          INTERVAL_HOURS: ${{ vars.CANARY_INTERVAL_HOURS }}
          NIGHTLY_MAX_AGE_HOURS: ${{ vars.NIGHTLY_MAX_AGE_HOURS }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pin="${PIN:-0.8.1}"
          interval="${INTERVAL_HOURS:-1}"

          max_age="${NIGHTLY_MAX_AGE_HOURS:-48}"
          nightly_pub=""
          nightly=""

          if [ -n "$REQUESTED" ]; then
            versions="[\"$REQUESTED\"]"
            nightly="manual dispatch of $REQUESTED, freshness gate not applied"
            echo "manual dispatch, testing $REQUESTED only"
          else
            latest="$(curl -fsSL https://api.github.com/repos/jolt-lang/jolt/releases/latest \
                      | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -1)"
            latest="${latest#v}"
            [ -n "$latest" ] || { echo "could not resolve jolt's latest release" >&2; exit 1; }

            # The nightly is a PRERELEASE, so releases/latest never returns it and
            # the two resolutions cannot collide. Read it by tag.
            #
            # A missing release is not an error here: jolt could stop publishing
            # nightlies and the release rows would still be worth running. It is a
            # skipped row with a stated reason, like a stale one.
            pub="$(curl -fsSL https://api.github.com/repos/jolt-lang/jolt/releases/tags/vnightly \
                   | sed -n 's/.*"published_at": *"\([^"]*\)".*/\1/p' | head -1)"
            if [ -z "$pub" ]; then
              nightly="nightly SKIPPED: no vnightly release found"
            else
              age=$(( ( $(date -u +%s) - $(date -u -d "$pub" +%s 2>/dev/null || echo 0) ) / 3600 ))
              if [ "$age" -le "$max_age" ]; then
                nightly_pub="$pub"
                nightly="nightly published $pub, ${age}h old"
              else
                nightly="nightly SKIPPED: published $pub, ${age}h old, limit ${max_age}h. jolt's publish-nightly is gated on its downstream library suites, so a lagging library withholds new builds while the old one stays installable"
              fi
            fi

            # Build the set. $latest is dropped when it equals the pin, so a
            # current fleet collapses to one release build plus the nightly.
            set -- "$pin"
            [ "$latest" != "$pin" ] && set -- "$@" "$latest"
            [ -n "$nightly_pub" ] && set -- "$@" "nightly"
            versions="[$(printf '"%s",' "$@" | sed 's/,$//')]"
            echo "testing $versions"
          fi
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "nightly=$nightly" >> "$GITHUB_OUTPUT"
          echo "$nightly"

          # The cache key IS the change detector. A new jolt release changes the
          # version set, which changes the key, which misses the cache.
          #
          # The nightly needs the published_at folded in, because the literal
          # string "nightly" is identical from one day to the next. Without it the
          # first green would cache a key that every later run also computes, and
          # the nightly row would never run again however far main moved.
          key="canary-green-$(printf '%s' "$versions" | tr -d '[]" ' | tr ',' '-')"
          [ -n "$nightly_pub" ] && key="$key-$(printf '%s' "$nightly_pub" | tr -cd '0-9')"
          echo "key=$key" >> "$GITHUB_OUTPUT"

          if [ "$EVENT" != "schedule" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual run, gates skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Interval gate, measured from the last canary that actually BUILT
          # something, not the last tick.
          #
          # A gated tick still finishes as a run whose conclusion is "success"
          # (plan succeeded, everything downstream skipped), so counting runs
          # would reset the clock every hour and an interval above 1 would never
          # come due. The tell is whether a run has any `jolt <version>` job:
          # those exist only when the matrix actually ran.
          last=""
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow canary.yml \
                        --status completed --limit 12 --json databaseId \
                        --jq '.[].databaseId' 2>/dev/null); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs" \
                 --jq '.jobs[].name' 2>/dev/null | grep -q '^jolt '; then
              last="$(gh run view "$id" --repo "$GITHUB_REPOSITORY" \
                       --json updatedAt --jq .updatedAt 2>/dev/null || true)"
              break
            fi
          done
          if [ -n "$last" ]; then
            age=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s 2>/dev/null || echo 0) ) / 3600 ))
            if [ "$age" -lt "$interval" ]; then
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "reason=last run was ${age}h ago, interval is ${interval}h" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "reason=due" >> "$GITHUB_OUTPUT"

      # Change gate. A hit means this exact version set already passed, so
      # nothing about jolt has moved and there is nothing to learn.
      - name: Have we already passed this version set?
        id: seen
        if: steps.decide.outputs.proceed == 'true' && github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .canary-state
          key: ${{ steps.decide.outputs.key }}
          lookup-only: true

      # Both gates land here. A step cannot rewrite an earlier step's output,
      # so the job's `proceed` reads THIS step and not `decide`, which knows
      # only about the interval.
      - name: Final decision
        id: final
        env:
          INTERVAL_OK: ${{ steps.decide.outputs.proceed }}
          ALREADY_GREEN: ${{ steps.seen.outputs.cache-hit }}
          REASON: ${{ steps.decide.outputs.reason }}
          KEY: ${{ steps.decide.outputs.key }}
        run: |
          set -euo pipefail
          if [ "$INTERVAL_OK" != "true" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "SKIPPING: $REASON"
          elif [ "$ALREADY_GREEN" = "true" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "SKIPPING: $KEY already passed, so jolt has not moved"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "RUNNING: $REASON"
          fi

  fleet:
    name: jolt ${{ matrix.version }}
    needs: plan
    if: needs.plan.outputs.proceed == 'true'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.plan.outputs.versions) }}
    uses: ./.github/workflows/fanout.yml
    with:
      jolt-version: ${{ matrix.version }}
    secrets: inherit

  report:
    needs: [plan, fleet]
    if: always() && needs.plan.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Mint an installation token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: jlt-commons
          repositories: ci-builds

      - name: Open, update or close the canary issue
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RESULT: ${{ needs.fleet.result }}
          VERSIONS: ${{ needs.plan.outputs.versions }}
          NIGHTLY: ${{ needs.plan.outputs.nightly }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="canary: jolt breaks the fleet"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
                      --search "$TITLE in:title" --limit 1 \
                      --json number --jq '.[0].number // ""')

          if [ "$RESULT" = "success" ]; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
                --body "Recovered. The fleet builds against ${VERSIONS}. ${NIGHTLY}. [Run](${RUN_URL})"
              gh issue close "$existing" --repo "$GITHUB_REPOSITORY"
              echo "closed #$existing"
            else
              echo "green against ${VERSIONS}, nothing to report"
            fi
            exit 0
          fi

          # Which matrix legs failed. The job names carry the version, so the
          # issue can name it rather than making a reader open the run.
          broke=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
                   --jq '[.jobs[] | select(.conclusion=="failure") | .name] | join(", ")' 2>/dev/null || echo "")

          body=$(printf '%s\n' \
            "The fleet does not build against every jolt version it is meant to." \
            "" \
            "**Versions tested:** ${VERSIONS}" \
            "**Failing:** ${broke:-see the run}" \
            "**Nightly:** ${NIGHTLY:-not resolved}" \
            "" \
            "[Run](${RUN_URL}) has a per-project table for each version." \
            "" \
            "This issue closes itself once a later canary passes. Reproduce one" \
            "project by dispatching its own ci.yml with the \`jolt-version\` input.")

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "commented on #$existing"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
          fi

  remember:
    # Only a green run is worth remembering. Saving on failure would mark a
    # broken version set as tested and suppress every later attempt at it.
    needs: [plan, fleet]
    if: needs.plan.outputs.proceed == 'true' && needs.fleet.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p .canary-state && date -u +%FT%TZ > .canary-state/passed-at
      - uses: actions/cache/save@v4
        with:
          path: .canary-state
          key: ${{ needs.plan.outputs.key }}
