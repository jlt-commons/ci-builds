name: canary

# ---------------------------------------------------------------------------
# Ask, on a schedule, whether the jolt versions this fleet cares about still
# build every project. Two of them:
#
#   latest   jolt's newest published release
#   nightly  jolt's rolling vnightly prerelease, when fresh
#
# The decisions live in src/fleet/canary.clj, which says why each rule exists:
# the nightly freshness and duplicate-of-release checks, the cache key that
# carries the nightly's published_at, the interval gate, and what the issue
# says. This file wires them to jobs. The plan job runs `jolt fleet:plan`
# (what to test, and the interval gate), then an actions/cache lookup (the
# change gate, which a task cannot do), then `jolt fleet:plan --final` to
# combine the two. The report job runs `jolt fleet:report`.
#
# What each project pins is not a row here. The `status` job reads every
# project's own latest push CI run on its default branch and shows it as the
# "pin" column on the dashboard, so the pin is observed rather than configured.
#
# Every run also ends with the `status` job, which merges the results into
# status.json and history.json on the `status` branch. The fleet page reads
# those two files. A gated tick still runs it, so the pin column keeps up with
# each project's own CI while jolt stands still. Publishing commits only when
# the content changed, or when the last commit is 6 or more hours old (a
# heartbeat, about 4 commits a day), so the dashboard's generated_at moves at
# least that often and its 12 hour staleness banner fires only when the canary
# has really stopped.
#
# vars.CANARY_INTERVAL_HOURS (default 0, no interval gate) holds a scheduled
# tick back. The cron itself cannot be a variable, GitHub requires a literal.
# vars.NIGHTLY_MAX_AGE_HOURS (default 48) is the nightly freshness limit.
# vars.CANARY_RETRY_HOURS (default 6) sizes the retry window: a version set
# that did not pass is tried once per window, and a new version set is tried at
# once.
# A manual dispatch ignores both gates. That is the point of a manual dispatch.
# ---------------------------------------------------------------------------

on:
  schedule:
    # Every 15 minutes, offset from the quarter hours, where GitHub's
    # scheduler is most congested and most likely to delay or drop a run.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      jolt-version:
        description: "Test only this version (blank = latest, plus nightly when fresh)"
        required: false
        default: ""

# Read only. The report job's App token carries issues: write, and the status
# job's own block adds contents: write, so nothing else holds either.
permissions:
  contents: read
  actions: read

env:
  # The tool jolt: runs the fleet tools. Pinned, and never the jolt under test.
  TOOLS_JOLT_VERSION: ${{ vars.TOOLS_JOLT_VERSION || '0.8.27' }}

# One canary at a time. A run that outlives its 15-minute tick must not race
# the next one on the status branch, and cancelling it would lose its results,
# so later runs wait (GitHub keeps only the newest waiting one).
concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.decide.outputs.versions }}
      proceed: ${{ steps.final.outputs.proceed }}
      reason: ${{ steps.decide.outputs.reason }}
      key: ${{ steps.decide.outputs.key }}
      tried_key: ${{ steps.decide.outputs.tried_key }}
      nightly: ${{ steps.decide.outputs.nightly }}
      latest: ${{ steps.decide.outputs.latest }}
      nightly_json: ${{ steps.decide.outputs.nightly_json }}
    steps:
      - uses: actions/checkout@v7

      - uses: jlt-commons/setup-jolt@v1
        with:
          version: ${{ env.TOOLS_JOLT_VERSION }}

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.jolt/gitlibs
          key: jolt-gitlibs-${{ hashFiles('deps.edn') }}

      # jolt.yaml loads libyaml, which the runner image carries today. Say so
      # explicitly so an image change cannot break the tools silently.
      - run: |
          dpkg -s libyaml-0-2 >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libyaml-0-2; }

      # Latest is resolved on every event, a manual dispatch included, because
      # the status page shows what latest is whatever was asked for.
      - name: Work out what to test, and whether to bother
        id: decide
        env:
          REQUESTED: ${{ inputs.jolt-version }}
          INTERVAL_HOURS: ${{ vars.CANARY_INTERVAL_HOURS }}
          RETRY_HOURS: ${{ vars.CANARY_RETRY_HOURS }}
          NIGHTLY_MAX_AGE_HOURS: ${{ vars.NIGHTLY_MAX_AGE_HOURS }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: jolt fleet:plan

      # Change gate. A hit means this exact version set already passed, so
      # nothing about jolt has moved and there is nothing to learn.
      - name: Have we already passed this version set?
        id: seen
        if: steps.decide.outputs.proceed == 'true' && github.event_name == 'schedule'
        uses: actions/cache/restore@v6.1.0
        with:
          path: .canary-state
          key: ${{ steps.decide.outputs.key }}
          lookup-only: true

      # Retry backoff (R35). A run that did not pass saves this key, which
      # holds the version set and the current window (epoch hours div
      # vars.CANARY_RETRY_HOURS, default 6). A hit means this exact set was
      # already tried in this window, so a known-bad set is retried once per
      # window while a new version set has a new key and runs on the next tick.
      - name: Have we already tried this version set in this window?
        id: tried
        if: steps.decide.outputs.proceed == 'true' && github.event_name == 'schedule'
        uses: actions/cache/restore@v6.1.0
        with:
          path: .canary-state
          key: ${{ steps.decide.outputs.tried_key }}
          lookup-only: true

      # The gates land here. A step cannot rewrite an earlier step's output,
      # so the job's `proceed` reads THIS step and not `decide`, which knows
      # only about the interval.
      - name: Final decision
        id: final
        env:
          INTERVAL_OK: ${{ steps.decide.outputs.proceed }}
          ALREADY_GREEN: ${{ steps.seen.outputs.cache-hit }}
          ALREADY_TRIED: ${{ steps.tried.outputs.cache-hit }}
          REASON: ${{ steps.decide.outputs.reason }}
          KEY: ${{ steps.decide.outputs.key }}
        run: jolt fleet:plan --final

  fleet:
    name: jolt ${{ matrix.version }}
    needs: plan
    if: needs.plan.outputs.proceed == 'true'
    strategy:
      fail-fast: false
      # ONE version at a time. Each leg's fan-out dispatches every project's
      # own ci.yml on `main`, and two legs in flight together would dispatch
      # the SAME project on the SAME ref twice within seconds. A project whose
      # concurrency group cancels in progress (raylib-ios does, with no ref
      # guard) then loses the earlier run: in run 33999584713 it was cancelled
      # in both the nightly and 0.8.1 legs, 2-3s after being created.
      # max-parallel: 1 runs the legs one after another, so no project is
      # dispatched twice at once. It costs wall-clock (up to ~2x on a run that
      # tests both rows) and nothing else. The concurrency group keeps
      # overlapping ticks from stacking up, and a run that is cancelled anyway
      # reads not-run in fan-out, never fail (R37).
      max-parallel: 1
      matrix:
        version: ${{ fromJSON(needs.plan.outputs.versions) }}
    # A called workflow cannot hold more than its caller grants, and fan-out's
    # ad-hoc publish job asks for contents: write. It skips under canary, but
    # GitHub checks the request when it parses the file, so the cap is raised
    # here. fan-out's own jobs still declare contents: read.
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/fanout.yml
    with:
      jolt-version: ${{ matrix.version }}
    secrets: inherit

  # Merge this run's results into status.json and history.json on the `status`
  # branch. Runs on gated ticks too (no results files then), so the pin column
  # and the timestamp keep moving. contents: write is granted here and nowhere
  # else; the App token is only for the collectors' cross-repo reads.

  status:
    needs: [plan, fleet]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: jlt-commons/setup-jolt@v1
        with:
          version: ${{ env.TOOLS_JOLT_VERSION }}

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.jolt/gitlibs
          key: jolt-gitlibs-${{ hashFiles('deps.edn') }}

      # jolt.yaml loads libyaml, which the runner image carries today. Say so
      # explicitly so an image change cannot break the tools silently.
      - run: |
          dpkg -s libyaml-0-2 >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libyaml-0-2; }

      - name: Mint an installation token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: jlt-commons
          # Cross-repo reads only: each project's ci.yml, runs and jobs.
          permission-contents: read
          permission-actions: read

      # Reusable-workflow artifacts belong to this (the caller's) run. A gated
      # tick has none, so the step is skipped there rather than trusting the
      # action to treat "no match" as success; the script copes with no results.
      - uses: actions/download-artifact@v8
        if: needs.fleet.result != 'skipped'
        # An artifact that cannot be fetched leaves its project out of this
        # run's results. It must not stop the status or the issue.
        continue-on-error: true
        with:
          pattern: results-*
          path: results

      - name: Publish the fleet status
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          LATEST: ${{ needs.plan.outputs.latest }}
          NIGHTLY_JSON: ${{ needs.plan.outputs.nightly_json }}
          CANARY_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # fleet:publish refreshes in-process on every attempt (R27), so the
          # results files are plain arguments. A gated tick has none.
          if [ -d results ]; then
            mapfile -t files < <(find results -name results.json | sort)
          else
            files=()
          fi
          jolt fleet:publish "$RUNNER_TEMP/status-out" "${files[@]}"

  report:
    needs: [plan, fleet]
    # !cancelled() and not always(): a cancelled run must not open an issue.
    if: ${{ !cancelled() && needs.plan.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jlt-commons/setup-jolt@v1
        with:
          version: ${{ env.TOOLS_JOLT_VERSION }}

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.jolt/gitlibs
          key: jolt-gitlibs-${{ hashFiles('deps.edn') }}

      # jolt.yaml loads libyaml, which the runner image carries today. Say so
      # explicitly so an image change cannot break the tools silently.
      - run: |
          dpkg -s libyaml-0-2 >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libyaml-0-2; }

      - name: Mint an installation token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: jlt-commons
          repositories: ci-builds
          # Opens, comments on and closes the canary issue, and reads this run's
          # job names for the issue text.
          permission-issues: write
          permission-actions: read

      # needs.fleet.outputs.failed holds one matrix leg's value, so the verdict
      # is read from every leg's results file instead.
      - uses: actions/download-artifact@v8
        if: needs.fleet.result != 'skipped'
        # An artifact that cannot be fetched leaves its project out of this
        # run's results. It must not stop the status or the issue.
        continue-on-error: true
        with:
          pattern: results-*
          path: results

      # Opens, comments on or closes the single "canary: jolt breaks the
      # fleet" issue. The rules are in src/fleet/canary.clj.
      - name: Open, update or close the canary issue
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RESULT: ${{ needs.fleet.result }}
          VERSIONS: ${{ needs.plan.outputs.versions }}
          NIGHTLY: ${{ needs.plan.outputs.nightly }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: jolt fleet:report results

  remember:
    # Only a green run is worth remembering. Saving on failure would mark a
    # broken version set as tested and suppress every later attempt at it.
    needs: [plan, fleet]
    if: needs.plan.outputs.proceed == 'true' && needs.fleet.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p .canary-state && date -u +%FT%TZ > .canary-state/passed-at
      - uses: actions/cache/save@v6.1.0
        with:
          path: .canary-state
          key: ${{ needs.plan.outputs.key }}

  # Retry backoff (R35). A fleet result that is not success marks this version
  # set as tried for the current window, so the next ticks skip it instead of
  # dispatching every project every 15 minutes. Same dummy-file trick as
  # `remember`: the cache action needs a path that exists. !cancelled() so a
  # failed fleet job does not skip this job, while a cancelled workflow still
  # does.
  remember-tried:
    needs: [plan, fleet]
    if: ${{ !cancelled() && needs.plan.outputs.proceed == 'true' && needs.fleet.result != 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p .canary-state && date -u +%FT%TZ > .canary-state/tried-at
      - uses: actions/cache/save@v6.1.0
        with:
          path: .canary-state
          key: ${{ needs.plan.outputs.tried_key }}
