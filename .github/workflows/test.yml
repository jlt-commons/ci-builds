name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y bats
      - run: bats test/
      - run: shellcheck -x scripts/lib/*.sh scripts/build-status.sh scripts/collect-own-pin.sh scripts/collect-uncovered.sh
