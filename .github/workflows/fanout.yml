name: fan-out

# ---------------------------------------------------------------------------
# Build every jlt-commons project against one jolt version, and report the
# whole fleet in a single table.
#
# It does NOT rebuild anything itself. Each project's own ci.yml already knows
# how to build it (raygui needs raylib natives, glitter-uikit needs AppKit and
# GTK4, glitter-gl needs a GL context under Xvfb, raylib-ios runs its pure
# scenes under jolt on Linux because its real target is a phone), and every one
# of them
# accepts a `jolt-version` dispatch input that overrides its pinned
# JOLT_VERSION for a single run. So this workflow dispatches those and collects
# the answers. Reimplementing five build environments here would rot, and would
# test something other than what a contributor actually hits.
#
# Auth is the jlt-commons-ci GitHub App rather than a PAT, so a run is
# attributed to the App and not to whoever pressed the button, and the token it
# mints lives for an hour and reaches exactly seven repositories.
#
# Why this exists: jolt v0.8.0 published 2026-09-01 and reversed
# jolt.ffi/write's last two arguments (jolt-lang/jolt#802). Both spellings are
# plain integers, so a mismatch writes to the wrong address and reports
# nothing. Finding that out one repository at a time, days apart, is the thing
# this workflow is meant to replace.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      jolt-version:
        description: "jolt version to test every project against (blank = jolt's latest release)"
        required: false
        default: ""
  workflow_call:
    inputs:
      jolt-version:
        type: string
        required: false
        default: ""
    outputs:
      failed:
        description: "Space-separated projects that did not pass"
        value: ${{ jobs.fanout.outputs.failed }}
      infra:
        description: "Space-separated projects whose jolt could not be installed at all"
        value: ${{ jobs.fanout.outputs.infra }}
      version:
        description: "The jolt version actually tested"
        value: ${{ jobs.fanout.outputs.version }}

permissions:
  contents: read

jobs:
  fanout:
    name: fan-out
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      failed: ${{ steps.run.outputs.failed }}
      infra: ${{ steps.run.outputs.infra }}
      version: ${{ steps.version.outputs.version }}

    steps:
      # fleet.json (the project list) and scripts/lib/version.sh live here.
      # Under workflow_call this checks out the caller's ref of this same repo.
      - uses: actions/checkout@v7

      # Mints a token scoped to the App's seven repositories, valid one hour.
      # Never a PAT: a PAT would act as whoever created it, and any collaborator
      # able to run this workflow would be borrowing that identity.
      - name: Mint an installation token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: jlt-commons

      - name: Resolve the jolt version
        id: version
        env:
          REQUESTED: ${{ inputs.jolt-version }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ]; then
            version="$REQUESTED"
            echo "Using the requested jolt $version"
          else
            # The App cannot read jolt-lang (a different org), but the release
            # list is public, so an unauthenticated read is both sufficient and
            # correct here.
            version="$(curl -fsSL https://api.github.com/repos/jolt-lang/jolt/releases/latest \
                       | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -1)"
            version="${version#v}"
            [ -n "$version" ] || { echo "could not resolve jolt's latest release" >&2; exit 1; }
            echo "Using jolt's latest release, $version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Dispatch every project and wait
        id: run
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -uo pipefail
          # shellcheck source=scripts/lib/version.sh
          . scripts/lib/version.sh
          PROJECTS=$(jq -r '.projects | join(" ")' fleet.json)
          declare -A RUN CONC URL INST FSTEP FIN
          RES_DIR="${RUNNER_TEMP:-/tmp}/fanout-results"
          mkdir -p "$RES_DIR"

          # For nightly, the commit vnightly points at right now. An installed
          # jolt whose -g<hex> does not prefix this is a different build.
          NIGHTLY_SHA=""
          if [ "$VERSION" = "nightly" ]; then
            NIGHTLY_SHA="$(curl -fsSL https://api.github.com/repos/jolt-lang/jolt/git/refs/tags/vnightly \
                           | sed -n 's/.*"sha": *"\([^"]*\)".*/\1/p' | head -1)"
            [ -n "$NIGHTLY_SHA" ] || echo "::warning::could not resolve the vnightly sha, every nightly run will read as mismatch"
            echo "vnightly is $NIGHTLY_SHA"
          fi
          # A plain string, not an associative array: `${#arr[@]}` and
          # `${!arr[@]}` on an EMPTY associative array are only safe under
          # `set -u` from bash 4.4, and the empty case is the normal one here.
          # A string list behaves the same on every bash and is testable locally.
          NEEDID=""

          # `gh workflow run` prints the URL of the run it created, so READ THAT
          # rather than guessing. The guess this replaced was "the newest
          # workflow_dispatch run above a baseline recorded before dispatching",
          # which is a positive control: it always returns a plausible id, and
          # nothing in the output describes the gap between that id and the run
          # you meant.
          #
          # It was not merely theoretical. Canary run 33682325150 ran two fan-out
          # legs at once, 0.8.0 and 0.8.1, and BOTH claimed glitter run
          # 33682354193. gh had printed 33682349678 to the 0.8.1 leg and
          # 33682354193 to the 0.8.0 leg, and gh was right both times:
          # ...9678 installed v0.8.1 and ...4193 installed v0.8.0. So the 0.8.1
          # row reported a result for a build of 0.8.0. Both were green, which is
          # the only reason the wrong answer was harmless that day.
          #
          # Reading gh's own output removes the guess instead of narrowing it, and
          # it holds however many fan-outs run at once: a manual dispatch during
          # the nightly canary, three matrix legs, anything.
          echo "::group::dispatch jolt $VERSION"
          for p in $PROJECTS; do
            if out=$(gh workflow run ci.yml --repo "jlt-commons/$p" -f jolt-version="$VERSION" 2>&1); then
              printf '%s\n' "$out" | sed 's/^/    /'
              id=$(printf '%s' "$out" | sed -n 's#.*/actions/runs/\([0-9][0-9]*\).*#\1#p' | head -1)
              if [ -n "$id" ]; then
                RUN[$p]=$id
                URL[$p]="https://github.com/jlt-commons/$p/actions/runs/$id"
                echo "  dispatched $p -> run $id"
              else
                # An older gh prints no URL. Rather than silently fall back to the
                # heuristic this replaced, say so: the result is still produced,
                # and a human is told the attribution is a guess.
                NEEDID="$NEEDID $p"
                echo "::warning::gh printed no run URL for $p, falling back to newest-run matching. That is unreliable when fan-outs overlap."
                echo "  dispatched $p, run id unknown"
              fi
            else
              echo "  FAILED to dispatch $p"
              CONC[$p]="dispatch-failed"
            fi
          done
          echo "::endgroup::"

          # Only for projects whose id gh did not give us.
          if [ -n "$NEEDID" ]; then
            echo "::group::identify runs (fallback)"
            sleep 10
            for _ in $(seq 1 40); do
              waiting=0
              for p in $NEEDID; do
                [ -n "${RUN[$p]:-}" ] && continue
                [ -n "${CONC[$p]:-}" ] && continue
                id=$(gh run list --repo "jlt-commons/$p" --workflow ci.yml \
                      --event workflow_dispatch --limit 1 \
                      --json databaseId --jq '.[0].databaseId // 0' 2>/dev/null || echo 0)
                if [ "$id" != "0" ]; then
                  RUN[$p]=$id
                  URL[$p]="https://github.com/jlt-commons/$p/actions/runs/$id"
                  echo "  $p -> run $id (guessed)"
                else
                  waiting=1
                fi
              done
              [ "$waiting" = "0" ] && break
              sleep 5
            done
            for p in $NEEDID; do
              if [ -z "${RUN[$p]:-}" ] && [ -z "${CONC[$p]:-}" ]; then
                CONC[$p]="no-run-appeared"
                echo "  $p: no run appeared within the window"
              fi
            done
            echo "::endgroup::"
          fi

          echo "::group::wait for completion"
          for _ in $(seq 1 150); do
            waiting=0
            for p in $PROJECTS; do
              [ -n "${CONC[$p]:-}" ] && continue
              read -r st cc < <(gh run view "${RUN[$p]}" --repo "jlt-commons/$p" \
                                 --json status,conclusion \
                                 --jq '"\(.status) \(.conclusion // "-")"' 2>/dev/null || echo "unknown -")
              if [ "$st" = "completed" ]; then
                # "jolt broke this project" and "we could not install jolt" both
                # arrive as a failed run naming a project, and they call for
                # opposite responses: one is a finding about jolt, the other is
                # this fleet's own misconfiguration. Measured 2026-09-02:
                # JOLT_REPO was left pointing at a fork that publishes only
                # nightlies, so asking for 0.8.0 and 0.8.1 gave curl 404 and two
                # scheduled canaries reported the fleet broken when it was fine.
                if [ "$cc" = "failure" ] && gh api \
                     "repos/jlt-commons/$p/actions/runs/${RUN[$p]}/jobs" \
                     --jq '.jobs[].steps[]? | select(.conclusion=="failure") | .name' \
                     2>/dev/null | grep -qi 'install jolt'; then
                  cc="toolchain-unavailable"
                fi
                FIN[$p]=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                if [ "$cc" = "failure" ]; then
                  FSTEP[$p]=$(gh api "repos/jlt-commons/$p/actions/runs/${RUN[$p]}/jobs" \
                    --jq '[.jobs[].steps[]? | select(.conclusion=="failure") | .name] | first // empty' \
                    2>/dev/null || true)
                elif [ "$cc" = "success" ]; then
                  # A green run is not proof it ran the jolt we asked for: read
                  # the `jolt --version` line out of each job's log.
                  # One job may install a different jolt on purpose (glitter-gl keeps
                  # a v0.7.29 job), so the run counts if ANY job ran the requested one.
                  logs=()
                  for jid in $(gh api "repos/jlt-commons/$p/actions/runs/${RUN[$p]}/jobs" \
                                 --jq '.jobs[].id' 2>/dev/null); do
                    gh api --allow-escape-sequences "repos/jlt-commons/$p/actions/jobs/$jid/logs" \
                      > "$RES_DIR/$p-$jid.log" 2> "$RES_DIR/$p-$jid.err" \
                      || echo "::warning::could not fetch the log of $p job $jid: $(head -c 300 "$RES_DIR/$p-$jid.err")"
                    logs+=("$RES_DIR/$p-$jid.log")
                  done
                  if inst=$(pick_installed "$VERSION" "$NIGHTLY_SHA" "${logs[@]}"); then :; else cc="mismatch"; fi
                  INST[$p]="$inst"
                fi
                CONC[$p]="$cc"
                echo "  $p: $cc${INST[$p]:+ (jolt ${INST[$p]})}"
              else
                waiting=1
              fi
            done
            [ "$waiting" = "0" ] && break
            sleep 20
          done
          for p in $PROJECTS; do
            [ -z "${CONC[$p]:-}" ] && CONC[$p]="timed-out"
          done
          echo "::endgroup::"

          # Render the table this workflow exists to produce.
          failed=""
          infra=""
          mismatch=""
          : > "$RES_DIR/projects.jsonl"
          {
            echo "## jolt \`$VERSION\` across jlt-commons"
            echo
            echo "| project | result | run |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for p in $PROJECTS; do
            c="${CONC[$p]}"
            case "$c" in
              success)   icon="pass" ;;
              skipped)   icon="skipped" ;;
              mismatch)  icon="**WRONG JOLT** (ran ${INST[$p]:-no version found})"
                         mismatch="$mismatch $p"; failed="$failed $p" ;;
              toolchain-unavailable)
                         icon="**could not install jolt**"; infra="$infra $p" ;;
              *)         icon="**FAIL** ($c)"; failed="$failed $p" ;;
            esac
            link="-"
            [ -n "${URL[$p]:-}" ] && link="[run](${URL[$p]})"
            echo "| \`$p\` | $icon | $link |" >> "$GITHUB_STEP_SUMMARY"
            case "$c" in
              success)                          r=pass ;;
              toolchain-unavailable)            r=infra ;;
              timed-out)                        r=timed-out ;;
              dispatch-failed|no-run-appeared)  r=dispatch-failed ;;
              mismatch)                         r=mismatch ;;
              skipped)                          r=not-run ;;
              *)                                r=fail ;;
            esac
            jq -nc --arg name "$p" --arg result "$r" --arg installed "${INST[$p]:-}" \
                   --arg url "${URL[$p]:-}" --arg fin "${FIN[$p]:-}" --arg step "${FSTEP[$p]:-}" \
              '{name: $name, result: $result,
                installed: (if $installed == "" then null else $installed end),
                run_url: (if $url == "" then null else $url end),
                finished_at: (if $fin == "" then null else $fin end),
                failed_step: (if $step == "" then null else $step end)}' \
              >> "$RES_DIR/projects.jsonl"
          done
          failed="${failed# }"
          infra="${infra# }"
          mismatch="${mismatch# }"
          jq -s --arg requested "$VERSION" --arg sha "$NIGHTLY_SHA" \
                --arg fin "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{requested: $requested, nightly_sha: $sha, finished_at: $fin, run_url: $url, projects: .}' \
            "$RES_DIR/projects.jsonl" > "$RES_DIR/results.json"
          echo "results_dir=$RES_DIR" >> "$GITHUB_OUTPUT"
          echo "artifact=results-${VERSION//\//-}" >> "$GITHUB_OUTPUT"
          {
            echo
            [ -n "$mismatch" ] && echo "**Ran on the wrong jolt:** $mismatch"
            [ -n "$failed" ] && echo "**Broken by jolt \`$VERSION\`:** $failed"
            if [ -n "$infra" ]; then
              echo "**Could not install jolt \`$VERSION\` for:** $infra"
              echo
              echo "That is this fleet's own problem, not a fact about jolt. Usually"
              echo "the version does not exist in the repository being installed"
              echo "from: check each project's \`JOLT_REPO\`, which should be unset"
              echo "unless deliberately pointed at a fork."
            fi
            # Counted from PROJECTS rather than written out. The literal said five
            # for as long as there were five, then went on saying it after there
            # were six, which is what a count kept by hand beside the list it
            # counts always does eventually.
            [ -z "$failed$infra" ] && echo "All $(set -- $PROJECTS; echo $#) projects build against jolt \`$VERSION\`."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "infra=$infra" >> "$GITHUB_OUTPUT"
          [ -z "$failed$infra" ] || { echo "failing: ${failed:-none}  infra: ${infra:-none}" >&2; exit 1; }

      - name: Upload results.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.run.outputs.artifact || format('results-{0}', steps.version.outputs.version) }}
          path: ${{ steps.run.outputs.results_dir }}/results.json
          if-no-files-found: warn

  # An ad-hoc (workflow_dispatch) fan-out publishes its own result to the status
  # page's history. Under workflow_call github.workflow is the CALLER's name, so
  # this skips under canary, whose own `status` job publishes instead. It adds
  # to history only: --nightly-json null keeps the grid's nightly cells as they
  # were.
  publish-adhoc:
    needs: fanout
    if: always() && github.workflow == 'fan-out'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Mint an installation token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: jlt-commons

      - uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: results

      - name: Publish the fleet status
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          NIGHTLY_JSON: "null"
          CANARY_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          latest="$(curl -fsSL https://api.github.com/repos/jolt-lang/jolt/releases/latest \
                    | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -1)"
          latest="${latest#v}"
          [ -n "$latest" ] || { echo "could not resolve jolt's latest release" >&2; exit 1; }
          export LATEST="$latest"
          # REBUILD is a command string for publish-status.sh to run with sh -c,
          # so the quotes are meant literally.
          # shellcheck disable=SC2089,SC2090
          REBUILD='bash scripts/refresh-status.sh "$OUT_DIR"'
          if [ -d results ]; then
            while IFS= read -r f; do REBUILD="$REBUILD '$PWD/$f'"; done \
              < <(find results -name results.json | sort)
          fi
          # shellcheck disable=SC2090
          export REBUILD
          echo "REBUILD: $REBUILD"
          bash scripts/publish-status.sh "$RUNNER_TEMP/status-out"
