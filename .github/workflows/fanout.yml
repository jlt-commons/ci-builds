name: fan-out

# ---------------------------------------------------------------------------
# Build every jlt-commons project against one jolt version, and report the
# whole fleet in a single table.
#
# It does NOT rebuild anything itself. Each project's own ci.yml already knows
# how to build it (raygui needs raylib natives, glitter-uikit needs AppKit and
# GTK4, glitter-gl needs a GL context under Xvfb, raylib-ios runs its pure
# scenes under jolt on Linux because its real target is a phone), and every one
# of them accepts a `jolt-version` dispatch input that overrides its pinned
# JOLT_VERSION for a single run. So this workflow dispatches those and collects
# the answers. Reimplementing every project's build environment here would
# rot, and would test something other than what a contributor actually hits.
#
# Auth is the jlt-commons-ci GitHub App rather than a PAT, so a run is
# attributed to the App and not to whoever pressed the button, and the token it
# mints lives for an hour and reaches only the repositories the App is
# installed on.
#
# Why this exists: a jolt release can change an API without any error. v0.8.0
# reversed jolt.ffi/write's last two arguments (jolt-lang/jolt#802), and both
# spellings are plain integers, so a mismatch writes to the wrong address and
# reports nothing. One run over the whole fleet shows that on the day it
# happens, not one repository at a time days later. The loop and its rules are
# in src/fleet/fanout.clj.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      jolt-version:
        description: "jolt version to test every project against (blank = jolt's latest release)"
        required: false
        default: ""
  workflow_call:
    inputs:
      jolt-version:
        type: string
        required: false
        default: ""
    outputs:
      failed:
        description: "Space-separated projects that did not pass"
        value: ${{ jobs.fanout.outputs.failed }}
      infra:
        description: "Space-separated projects whose failure is not about jolt (install, dependency download, unreadable logs)"
        value: ${{ jobs.fanout.outputs.infra }}
      version:
        description: "The jolt version actually tested"
        value: ${{ jobs.fanout.outputs.version }}

permissions:
  contents: read

env:
  TOOLS_JOLT_VERSION: ${{ vars.TOOLS_JOLT_VERSION || '0.8.28' }}

jobs:
  fanout:
    name: fan-out
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A manual fan-out queues behind a running canary instead of racing it: two
    # dispatches of one project's ci.yml at once cancel each other when its
    # own concurrency group cancels in progress (R37). It joins the canary's
    # group only when run on its own. Called by the canary (github.workflow is
    # then `canary`), the caller already holds that group, so the job takes a
    # group of its own, which is unique per run and never waits.
    concurrency:
      group: ${{ github.workflow == 'fan-out' && 'canary' || format('fanout-called-{0}', github.run_id) }}
      cancel-in-progress: false
    outputs:
      failed: ${{ steps.run.outputs.failed }}
      infra: ${{ steps.run.outputs.infra }}
      version: ${{ steps.run.outputs.version }}

    steps:
      # fleet.json (the project list) and src/fleet live here.
      # Under workflow_call this checks out the caller's ref of this same repo.
      - uses: actions/checkout@v7

      # The tool jolt runs the fan-out loop. Pinned, and never the jolt under
      # test: a release published overnight must not change the tool.
      - uses: jlt-commons/setup-jolt@v1
        with:
          version: ${{ env.TOOLS_JOLT_VERSION }}

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.jolt/gitlibs
          key: jolt-gitlibs-${{ hashFiles('deps.edn') }}

      # jolt.yaml loads libyaml, which the runner image carries today. Say so
      # explicitly so an image change cannot break the tools silently.
      - run: |
          dpkg -s libyaml-0-2 >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libyaml-0-2; }

      # Mints a token scoped to the repositories the App is installed on, valid
      # one hour.
      # Never a PAT: a PAT would act as whoever created it, and any collaborator
      # able to run this workflow would be borrowing that identity.
      - name: Mint an installation token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: jlt-commons

      - name: Dispatch every project and wait
        id: run
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ inputs.jolt-version }}
        # The loop lives in src/fleet/fanout.clj, which says why each rule
        # exists. A blank VERSION means jolt's latest release.
        run: jolt fleet:fanout "$VERSION"

      - name: Upload results.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.run.outputs.artifact || format('results-{0}', steps.run.outputs.version) }}
          path: ${{ steps.run.outputs.results_dir }}/results.json
          if-no-files-found: warn

  # An ad-hoc (workflow_dispatch) fan-out publishes its own result to the status
  # page's history. Under workflow_call github.workflow is the CALLER's name, so
  # this skips under canary, whose own `status` job publishes instead. It adds
  # to history only: --nightly-json null keeps the grid's nightly cells as they
  # were.
  publish-adhoc:
    needs: fanout
    if: always() && github.workflow == 'fan-out'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: jlt-commons/setup-jolt@v1
        with:
          version: ${{ env.TOOLS_JOLT_VERSION }}

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.jolt/gitlibs
          key: jolt-gitlibs-${{ hashFiles('deps.edn') }}

      - run: |
          dpkg -s libyaml-0-2 >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libyaml-0-2; }

      - name: Mint an installation token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: jlt-commons
          # Cross-repo reads only: each project's ci.yml, runs and jobs.
          permission-contents: read
          permission-actions: read

      - uses: actions/download-artifact@v8
        # An artifact that cannot be fetched leaves its project out of the
        # results. It must not stop the publish.
        continue-on-error: true
        with:
          pattern: results-*
          path: results

      - name: Publish the fleet status
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          NIGHTLY_JSON: "null"
          CANARY_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # fleet:publish refreshes in-process on every attempt (R27), so the
          # results files are plain arguments.
          if [ -d results ]; then
            mapfile -t files < <(find results -name results.json | sort)
          else
            files=()
          fi
          jolt fleet:publish "$RUNNER_TEMP/status-out" "${files[@]}"
