name: fan-out

# ---------------------------------------------------------------------------
# Build every jlt-commons project against one jolt version, and report the
# whole fleet in a single table.
#
# It does NOT rebuild anything itself. Each project's own ci.yml already knows
# how to build it (raygui needs raylib natives, glitter-uikit needs AppKit and
# GTK4, glitter-gl needs a GL context under Xvfb), and every one of them
# accepts a `jolt-version` dispatch input that overrides its pinned
# JOLT_VERSION for a single run. So this workflow dispatches those and collects
# the answers. Reimplementing five build environments here would rot, and would
# test something other than what a contributor actually hits.
#
# Auth is the jlt-commons-ci GitHub App rather than a PAT, so a run is
# attributed to the App and not to whoever pressed the button, and the token it
# mints lives for an hour and reaches exactly six repositories.
#
# Why this exists: jolt v0.8.0 published 2026-09-01 and reversed
# jolt.ffi/write's last two arguments (jolt-lang/jolt#802). Both spellings are
# plain integers, so a mismatch writes to the wrong address and reports
# nothing. Finding that out one repository at a time, days apart, is the thing
# this workflow is meant to replace.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      jolt-version:
        description: "jolt version to test every project against (blank = jolt's latest release)"
        required: false
        default: ""
  workflow_call:
    inputs:
      jolt-version:
        type: string
        required: false
        default: ""
    outputs:
      failed:
        description: "Space-separated projects that did not pass"
        value: ${{ jobs.fanout.outputs.failed }}
      infra:
        description: "Space-separated projects whose jolt could not be installed at all"
        value: ${{ jobs.fanout.outputs.infra }}
      version:
        description: "The jolt version actually tested"
        value: ${{ jobs.fanout.outputs.version }}

permissions:
  contents: read

jobs:
  fanout:
    name: fan-out
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      failed: ${{ steps.run.outputs.failed }}
      infra: ${{ steps.run.outputs.infra }}
      version: ${{ steps.version.outputs.version }}

    steps:
      # Mints a token scoped to the App's six repositories, valid one hour.
      # Never a PAT: a PAT would act as whoever created it, and any collaborator
      # able to run this workflow would be borrowing that identity.
      - name: Mint an installation token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: jlt-commons

      - name: Resolve the jolt version
        id: version
        env:
          REQUESTED: ${{ inputs.jolt-version }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ]; then
            version="$REQUESTED"
            echo "Using the requested jolt $version"
          else
            # The App cannot read jolt-lang (a different org), but the release
            # list is public, so an unauthenticated read is both sufficient and
            # correct here.
            version="$(curl -fsSL https://api.github.com/repos/jolt-lang/jolt/releases/latest \
                       | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -1)"
            version="${version#v}"
            [ -n "$version" ] || { echo "could not resolve jolt's latest release" >&2; exit 1; }
            echo "Using jolt's latest release, $version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Dispatch every project and wait
        id: run
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -uo pipefail
          PROJECTS="glitter glitter-gl glitter-uikit raygui-jlt raylib-jlt"
          declare -A RUN CONC URL
          # A plain string, not an associative array: `${#arr[@]}` and
          # `${!arr[@]}` on an EMPTY associative array are only safe under
          # `set -u` from bash 4.4, and the empty case is the normal one here.
          # A string list behaves the same on every bash and is testable locally.
          NEEDID=""

          # `gh workflow run` prints the URL of the run it created, so READ THAT
          # rather than guessing. The guess this replaced was "the newest
          # workflow_dispatch run above a baseline recorded before dispatching",
          # which is a positive control: it always returns a plausible id, and
          # nothing in the output describes the gap between that id and the run
          # you meant.
          #
          # It was not merely theoretical. Canary run 33682325150 ran two fan-out
          # legs at once, 0.8.0 and 0.8.1, and BOTH claimed glitter run
          # 33682354193. gh had printed 33682349678 to the 0.8.1 leg and
          # 33682354193 to the 0.8.0 leg, and gh was right both times:
          # ...9678 installed v0.8.1 and ...4193 installed v0.8.0. So the 0.8.1
          # row reported a result for a build of 0.8.0. Both were green, which is
          # the only reason the wrong answer was harmless that day.
          #
          # Reading gh's own output removes the guess instead of narrowing it, and
          # it holds however many fan-outs run at once: a manual dispatch during
          # the nightly canary, three matrix legs, anything.
          echo "::group::dispatch jolt $VERSION"
          for p in $PROJECTS; do
            if out=$(gh workflow run ci.yml --repo "jlt-commons/$p" -f jolt-version="$VERSION" 2>&1); then
              printf '%s\n' "$out" | sed 's/^/    /'
              id=$(printf '%s' "$out" | sed -n 's#.*/actions/runs/\([0-9][0-9]*\).*#\1#p' | head -1)
              if [ -n "$id" ]; then
                RUN[$p]=$id
                URL[$p]="https://github.com/jlt-commons/$p/actions/runs/$id"
                echo "  dispatched $p -> run $id"
              else
                # An older gh prints no URL. Rather than silently fall back to the
                # heuristic this replaced, say so: the result is still produced,
                # and a human is told the attribution is a guess.
                NEEDID="$NEEDID $p"
                echo "::warning::gh printed no run URL for $p, falling back to newest-run matching. That is unreliable when fan-outs overlap."
                echo "  dispatched $p, run id unknown"
              fi
            else
              echo "  FAILED to dispatch $p"
              CONC[$p]="dispatch-failed"
            fi
          done
          echo "::endgroup::"

          # Only for projects whose id gh did not give us.
          if [ -n "$NEEDID" ]; then
            echo "::group::identify runs (fallback)"
            sleep 10
            for _ in $(seq 1 40); do
              waiting=0
              for p in $NEEDID; do
                [ -n "${RUN[$p]:-}" ] && continue
                [ -n "${CONC[$p]:-}" ] && continue
                id=$(gh run list --repo "jlt-commons/$p" --workflow ci.yml \
                      --event workflow_dispatch --limit 1 \
                      --json databaseId --jq '.[0].databaseId // 0' 2>/dev/null || echo 0)
                if [ "$id" != "0" ]; then
                  RUN[$p]=$id
                  URL[$p]="https://github.com/jlt-commons/$p/actions/runs/$id"
                  echo "  $p -> run $id (guessed)"
                else
                  waiting=1
                fi
              done
              [ "$waiting" = "0" ] && break
              sleep 5
            done
            for p in $NEEDID; do
              if [ -z "${RUN[$p]:-}" ] && [ -z "${CONC[$p]:-}" ]; then
                CONC[$p]="no-run-appeared"
                echo "  $p: no run appeared within the window"
              fi
            done
            echo "::endgroup::"
          fi

          echo "::group::wait for completion"
          for _ in $(seq 1 150); do
            waiting=0
            for p in $PROJECTS; do
              [ -n "${CONC[$p]:-}" ] && continue
              read -r st cc < <(gh run view "${RUN[$p]}" --repo "jlt-commons/$p" \
                                 --json status,conclusion \
                                 --jq '"\(.status) \(.conclusion // "-")"' 2>/dev/null || echo "unknown -")
              if [ "$st" = "completed" ]; then
                # "jolt broke this project" and "we could not install jolt" both
                # arrive as a failed run naming a project, and they call for
                # opposite responses: one is a finding about jolt, the other is
                # this fleet's own misconfiguration. Measured 2026-09-02:
                # JOLT_REPO was left pointing at a fork that publishes only
                # nightlies, so asking for 0.8.0 and 0.8.1 gave curl 404 and two
                # scheduled canaries reported the fleet broken when it was fine.
                if [ "$cc" = "failure" ] && gh api \
                     "repos/jlt-commons/$p/actions/runs/${RUN[$p]}/jobs" \
                     --jq '.jobs[].steps[]? | select(.conclusion=="failure") | .name' \
                     2>/dev/null | grep -qi 'install jolt'; then
                  cc="toolchain-unavailable"
                fi
                CONC[$p]="$cc"
                echo "  $p: $cc"
              else
                waiting=1
              fi
            done
            [ "$waiting" = "0" ] && break
            sleep 20
          done
          for p in $PROJECTS; do
            [ -z "${CONC[$p]:-}" ] && CONC[$p]="timed-out"
          done
          echo "::endgroup::"

          # Render the table this workflow exists to produce.
          failed=""
          infra=""
          {
            echo "## jolt \`$VERSION\` across jlt-commons"
            echo
            echo "| project | result | run |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for p in $PROJECTS; do
            c="${CONC[$p]}"
            case "$c" in
              success)   icon="pass" ;;
              skipped)   icon="skipped" ;;
              toolchain-unavailable)
                         icon="**could not install jolt**"; infra="$infra $p" ;;
              *)         icon="**FAIL** ($c)"; failed="$failed $p" ;;
            esac
            link="-"
            [ -n "${URL[$p]:-}" ] && link="[run](${URL[$p]})"
            echo "| \`$p\` | $icon | $link |" >> "$GITHUB_STEP_SUMMARY"
          done
          failed="${failed# }"
          infra="${infra# }"
          {
            echo
            [ -n "$failed" ] && echo "**Broken by jolt \`$VERSION\`:** $failed"
            if [ -n "$infra" ]; then
              echo "**Could not install jolt \`$VERSION\` for:** $infra"
              echo
              echo "That is this fleet's own problem, not a fact about jolt. Usually"
              echo "the version does not exist in the repository being installed"
              echo "from: check each project's \`JOLT_REPO\`, which should be unset"
              echo "unless deliberately pointed at a fork."
            fi
            [ -z "$failed$infra" ] && echo "All 5 projects build against jolt \`$VERSION\`."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "infra=$infra" >> "$GITHUB_OUTPUT"
          [ -z "$failed$infra" ] || { echo "failing: ${failed:-none}  infra: ${infra:-none}" >&2; exit 1; }
